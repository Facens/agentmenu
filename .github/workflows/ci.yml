name: CI

# Build, test, bundle, and assert the bundle's layout and signature
# consistency on every push and pull request (R10). A pull request from a fork
# receives no secrets, so the bundle here is ad-hoc signed and the assertion is
# consistency, not authority: no Mach-O left linker-signed while another
# carries an identity, entitlements on the app only, hardened runtime
# requested (R24, KTD16). The authority check runs in release.yml, where the
# certificate exists.

on:
  push:
    branches: ["main"]
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: swift --version

      # Licence headers on every Swift file, and AgentMenuKit free of AppKit,
      # SwiftUI and Sparkle — in the manifest as well as in the imports.
      - name: Check the source tree
        run: packaging/check-source.sh

      # U8 / R17: the tmux the app ships, built from pinned sources (about
      # two and a half minutes cold). Restored from the cache when neither the
      # checksum file nor the build script changed. A cache hit is verified by
      # the binary's properties only (arm64, macOS 14.0 or lower, system
      # libraries only, jemalloc), not by the source checksums: those are
      # checked only when `make tmux` builds. It comes before the tests because
      # the session-host integration cases use it.
      - name: Restore the tmux build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/tmux
          key: tmux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/tmux/sources.sha256', 'packaging/tmux/build.sh') }}

      - name: Build tmux
        run: make tmux

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: make test

      - name: Bundle
        run: make bundle

      - name: Check bundle layout
        run: |
          test -x dist/AgentMenu.app/Contents/MacOS/AgentMenu
          test -x dist/AgentMenu.app/Contents/Resources/bin/agentmenu
          test -f dist/AgentMenu.app/Contents/Info.plist
          test -d dist/AgentMenu.app/Contents/Resources/agents
          # U8: the session host is in the bundle, under at least one name,
          # and every copy runs. The names come from bundle.sh, not from here.
          helpers=0
          for helper in dist/AgentMenu.app/Contents/Helpers/*; do
            helpers=$((helpers + 1))
            "$helper" -V | grep -qE '^tmux [0-9]'
          done
          test "$helpers" -ge 1

      - name: Assert signature consistency
        run: packaging/verify-signing.sh consistency dist/AgentMenu.app

      # The CLI imports only Foundation, Darwin and AgentMenuKit, so a UI
      # framework in its load commands can only have come through the Kit —
      # a link-level check no spelling of an import can dodge.
      - name: Assert the CLI links no UI framework
        run: |
          otool -L dist/AgentMenu.app/Contents/Resources/bin/agentmenu
          ! otool -L dist/AgentMenu.app/Contents/Resources/bin/agentmenu | grep -qE '/(AppKit|SwiftUI|Sparkle)\.framework/'
